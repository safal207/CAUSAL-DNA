name: GAP-001 Codebook methylation-aware triage

on:
  workflow_dispatch:
  push:
    branches:
      - agent/causal-dna-001-bootstrap
    paths:
      - 'analysis/gap001_codebook_motif_switch.py'
      - 'analysis/gap001_probe_mesmileseq_xlsx.py'
      - 'analysis/gap001_mesmileseq_methylation_triage.py'
      - 'tests/test_codebook_motif_switch.py'
      - 'tests/test_mesmileseq_methylation_triage.py'
      - '.github/workflows/gap001-codebook-methylation-triage.yml'
  pull_request:
    branches: [main]
    paths:
      - 'analysis/gap001_codebook_motif_switch.py'
      - 'analysis/gap001_probe_mesmileseq_xlsx.py'
      - 'analysis/gap001_mesmileseq_methylation_triage.py'
      - 'tests/test_codebook_motif_switch.py'
      - 'tests/test_mesmileseq_methylation_triage.py'
      - '.github/workflows/gap001-codebook-methylation-triage.yml'

permissions:
  contents: read

jobs:
  methylation-aware-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install -r analysis/requirements.txt
      - name: Run triage tests
        run: |
          python -m unittest tests.test_codebook_motif_switch -v
          python -m unittest tests.test_mesmileseq_methylation_triage -v
      - name: Fetch exact rs1421085 sequence and sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/codebook data/mesmile
          curl --fail --location --retry 4 --retry-all-errors \
            --output data/codebook/rs1421085.hg38.json \
            'https://api.genome.ucsc.edu/getData/sequence?genome=hg38;chrom=chr16;start=53766961;end=53767122'
          python - <<'PY'
          import json
          dna=json.load(open('data/codebook/rs1421085.hg38.json'))['dna'].upper()
          assert len(dna)==161 and dna[80]=='T'
          PY
          git clone --depth 1 https://github.com/autosome-ru/perspectives-on-codebook-allele-specificity.git upstream/codebook
          curl --fail --location --retry 4 --retry-all-errors \
            --output data/mesmile/supplementary-data-5.xlsx \
            'https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41467-026-71387-y/MediaObjects/41467_2026_71387_MOESM9_ESM.xlsx'
      - name: Download adult VPH expression matrices
        shell: bash
        run: |
          set -euo pipefail
          root='https://raw.githubusercontent.com/TheJacksonLaboratory/ventral-posterior-hypothalamus-scrnaseq/master/data/cellranger'
          for sample in AJ18003 AJ18004 AJ19001 AJ19002; do
            mkdir -p "data/gse146692/${sample}"
            curl --fail --location --retry 4 --retry-all-errors \
              --output "data/gse146692/${sample}/filtered_feature_bc_matrix.h5" \
              "${root}/${sample}/filtered_feature_bc_matrix.h5"
          done
      - name: Run exact allele motif scan
        run: |
          python analysis/gap001_codebook_motif_switch.py \
            --motif-dir upstream/codebook/motifs/manual_motifs_v2/pwms \
            --sequence-json data/codebook/rs1421085.hg38.json \
            --variant-index 80 --ref T --alt C \
            --expression-root data/gse146692 \
            --top-expression 50 \
            --output-dir results/gap001-codebook-methylation-triage
      - name: Join published meSMiLE methylation classes
        run: |
          python analysis/gap001_mesmileseq_methylation_triage.py \
            --xlsx data/mesmile/supplementary-data-5.xlsx \
            --motif-switches results/gap001-codebook-methylation-triage/motif_switches.csv \
            --expression-csv results/gap001-codebook-methylation-triage/vph_expression_feasibility.csv \
            --output-dir results/gap001-codebook-methylation-triage \
            --shortlist-size 40
          cat results/gap001-codebook-methylation-triage/methylation_triage_report.md
      - name: Guard causal boundary
        run: |
          python - <<'PY'
          import json, pathlib
          s=json.load(open('results/gap001-codebook-methylation-triage/methylation_triage_summary.json'))
          forbidden={'cause_found','causal_status','materialized','verified'}
          assert not (forbidden & set(s))
          text=pathlib.Path('results/gap001-codebook-methylation-triage/methylation_triage_report.md').read_text()
          assert 'not occupancy or causality' in text
          print(json.dumps(s,indent=2))
          PY
      - name: Upload methylation-aware discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: gap001-codebook-methylation-triage
          path: results/gap001-codebook-methylation-triage/
          if-no-files-found: error
          retention-days: 30
