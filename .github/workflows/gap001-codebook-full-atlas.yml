name: GAP-001 full 1421-TF Codebook atlas

on:
  workflow_dispatch:
  push:
    branches:
      - agent/causal-dna-001-bootstrap
    paths:
      - 'analysis/gap001_fetch_codebook_atlas.py'
      - 'analysis/gap001_prepare_codebook_atlas.py'
      - 'analysis/gap001_codebook_motif_switch.py'
      - 'tests/test_codebook_full_atlas.py'
      - 'tests/test_codebook_motif_switch.py'
      - '.github/workflows/gap001-codebook-full-atlas.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'analysis/gap001_fetch_codebook_atlas.py'
      - 'analysis/gap001_prepare_codebook_atlas.py'
      - 'analysis/gap001_codebook_motif_switch.py'
      - 'tests/test_codebook_full_atlas.py'
      - 'tests/test_codebook_motif_switch.py'
      - '.github/workflows/gap001-codebook-full-atlas.yml'

permissions:
  contents: read

jobs:
  full-codebook-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scientific dependencies
        run: python -m pip install -r analysis/requirements.txt

      - name: Test provenance and motif normalization
        run: |
          python -m unittest tests.test_codebook_full_atlas -v
          python -m unittest tests.test_codebook_motif_switch -v

      - name: Fetch Nature Supplementary Data 1
        run: |
          mkdir -p data/codebook-full results/gap001-codebook-full-atlas
          python analysis/gap001_fetch_codebook_atlas.py \
            --output-zip data/codebook-full/supplementary-data-1.zip \
            --provenance-json results/gap001-codebook-full-atlas/source-provenance.json

      - name: Normalize and assert full 1421-TF atlas contract
        run: |
          python analysis/gap001_prepare_codebook_atlas.py \
            --input-zip data/codebook-full/supplementary-data-1.zip \
            --output-dir data/codebook-full/pwms \
            --manifest results/gap001-codebook-full-atlas/atlas-manifest.json \
            --expected-tfs 1421
          test "$(find data/codebook-full/pwms -maxdepth 1 -name '*.pwm' | wc -l)" -eq 1421

      - name: Fetch exact hg38 rs1421085 sequence
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            --output data/codebook-full/rs1421085.hg38.json \
            'https://api.genome.ucsc.edu/getData/sequence?genome=hg38;chrom=chr16;start=53766961;end=53767122'
          python - <<'PY'
          import json
          p=json.load(open('data/codebook-full/rs1421085.hg38.json'))
          dna=p['dna'].upper()
          assert len(dna) == 161
          assert dna[80] == 'T'
          print('context', dna[70:91])
          PY

      - name: Download public adult VPH expression matrices
        shell: bash
        run: |
          set -euo pipefail
          root='https://raw.githubusercontent.com/TheJacksonLaboratory/ventral-posterior-hypothalamus-scrnaseq/master/data/cellranger'
          for sample in AJ18003 AJ18004 AJ19001 AJ19002; do
            mkdir -p "data/gse146692/${sample}"
            curl --fail --location --retry 4 --retry-all-errors \
              --output "data/gse146692/${sample}/filtered_feature_bc_matrix.h5" \
              "${root}/${sample}/filtered_feature_bc_matrix.h5"
          done

      - name: Scan exact T>C across all 1421 representative motifs
        run: |
          python analysis/gap001_codebook_motif_switch.py \
            --motif-dir data/codebook-full/pwms \
            --sequence-json data/codebook-full/rs1421085.hg38.json \
            --variant-index 80 \
            --ref T \
            --alt C \
            --expression-root data/gse146692 \
            --top-expression 50 \
            --output-dir results/gap001-codebook-full-atlas

      - name: Verify scan scope
        run: |
          python - <<'PY'
          import csv, json
          rows=list(csv.DictReader(open('results/gap001-codebook-full-atlas/motif_switches.csv')))
          manifest=json.load(open('results/gap001-codebook-full-atlas/atlas-manifest.json'))
          assert manifest['full_atlas_contract_pass'] is True
          assert len(rows) == 1421, len(rows)
          print('FULL_ATLAS_TFS', len(rows))
          print(open('results/gap001-codebook-full-atlas/report.md').read())
          PY

      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: gap001-codebook-full-atlas
          path: results/gap001-codebook-full-atlas/
          if-no-files-found: error
          retention-days: 30
