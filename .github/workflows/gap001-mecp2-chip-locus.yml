name: GAP-001 adult hypothalamus MeCP2 exact-locus context

on:
  workflow_dispatch:
  push:
    branches:
      - agent/causal-dna-001-bootstrap
    paths:
      - 'analysis/gap001_mecp2_chip_locus.py'
      - 'tests/test_gap001_mecp2_chip_locus.py'
      - '.github/workflows/gap001-mecp2-chip-locus.yml'
  pull_request:
    paths:
      - 'analysis/gap001_mecp2_chip_locus.py'
      - 'tests/test_gap001_mecp2_chip_locus.py'
      - '.github/workflows/gap001-mecp2-chip-locus.yml'

permissions:
  contents: read

jobs:
  mecp2-locus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test WIG parser and evidence boundary
        run: python -m pytest -q tests/test_gap001_mecp2_chip_locus.py

      - name: Lift exact mm10 ortholog base to mm9
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/liftOver https://hgdownload.soe.ucsc.edu/admin/exe/linux.x86_64/liftOver
          chmod +x /tmp/liftOver
          curl -fsSLo /tmp/mm10ToMm9.over.chain.gz https://hgdownload.soe.ucsc.edu/goldenPath/mm10/liftOver/mm10ToMm9.over.chain.gz
          gunzip /tmp/mm10ToMm9.over.chain.gz
          # Exact ortholog established by the repository's published-guide scan: mm10 chr8:91374372 (1-based).
          printf 'chr8\t91374371\t91374372\trs1421085_mouse_ortholog\n' > /tmp/mm10.bed
          /tmp/liftOver /tmp/mm10.bed /tmp/mm10ToMm9.over.chain /tmp/mm9.bed /tmp/unmapped.bed
          test -s /tmp/mm9.bed
          cat /tmp/mm9.bed
          python - <<'PY'
          from pathlib import Path
          parts=Path('/tmp/mm9.bed').read_text().strip().split('\t')
          assert len(parts) >= 3 and parts[0] == 'chr8', parts
          start,end=int(parts[1]),int(parts[2])
          assert end-start == 1, parts
          Path('/tmp/mm9_position0.txt').write_text(str(start)+'\n')
          print('MM9_POSITION0', start)
          print('MM9_POSITION1', start+1)
          PY

      - name: Resolve official GSE66868 processed WIG URLs from GEO
        shell: bash
        run: |
          set -euo pipefail
          for gsm in GSM1633577 GSM1633578; do
            curl --fail --location --retry 4 --retry-all-errors \
              -o "/tmp/${gsm}.soft" \
              "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=${gsm}&targ=self&view=full&form=text"
          done
          python - <<'PY'
          from pathlib import Path
          expected={'GSM1633577':'input','GSM1633578':'chip'}
          for gsm,kind in expected.items():
              lines=Path(f'/tmp/{gsm}.soft').read_text(errors='replace').splitlines()
              title=[x.split('=',1)[1].strip() for x in lines if x.startswith('!Sample_title = ')]
              urls=[x.split('=',1)[1].strip() for x in lines if x.startswith('!Sample_supplementary_file')]
              wig=[u for u in urls if u.endswith('.wig.gz')]
              assert len(title)==1 and len(wig)==1, (gsm,title,urls)
              url=wig[0].replace('ftp://ftp.ncbi.nlm.nih.gov/','https://ftp.ncbi.nlm.nih.gov/')
              Path(f'/tmp/{kind}_url.txt').write_text(url+'\n')
              print(gsm, title[0], url)
          PY

      - name: Download matched hypothalamus MeCP2 ChIP and Input WIGs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/input.wig.gz "$(cat /tmp/input_url.txt)"
          curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/chip.wig.gz "$(cat /tmp/chip_url.txt)"
          gzip -t /tmp/input.wig.gz
          gzip -t /tmp/chip.wig.gz
          ls -lh /tmp/input.wig.gz /tmp/chip.wig.gz

      - name: Query exact-locus MeCP2 context
        run: |
          pos=$(cat /tmp/mm9_position0.txt)
          python analysis/gap001_mecp2_chip_locus.py \
            --chip /tmp/chip.wig.gz \
            --input /tmp/input.wig.gz \
            --chrom chr8 \
            --position0 "$pos" \
            --assembly mm9 \
            --output /tmp/GAP-001-mecp2-chip-locus.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/GAP-001-mecp2-chip-locus.json'))
          assert p['dataset']=='GSE66868'
          assert p['cause_found'] is False
          print('QUERY',p['query'])
          print('EXACT',p['summary']['exact_base_signal'])
          print('PERCENTILE',p['summary']['local_percentile'])
          for k,v in p['summary']['windows'].items():
              print('WINDOW',k,v)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: GAP-001-mecp2-chip-locus
          path: /tmp/GAP-001-mecp2-chip-locus.json
          if-no-files-found: error
          retention-days: 30
