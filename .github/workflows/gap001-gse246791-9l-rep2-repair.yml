name: GAP-001 GSE246791 9L rep2 repair

on:
  workflow_dispatch:
  push:
    branches:
      - agent/causal-dna-001-bootstrap
    paths:
      - '.github/workflows/gap001-gse246791-9l-rep2-repair.yml'
      - 'analysis/gap001_query_h5ad_locus.py'

permissions:
  contents: read

jobs:
  repair-9l-rep2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HDF5 reader
        run: python -m pip install 'h5py>=3.11,<4'

      - name: Resolve official GSM7876882 supplementary H5AD URL
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors \
            -o /tmp/GSM7876882.soft \
            'https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSM7876882&targ=self&view=full&form=text'
          grep '^!Sample_' /tmp/GSM7876882.soft | head -80
          python - <<'PY'
          from pathlib import Path
          urls=[]
          title=None
          for line in Path('/tmp/GSM7876882.soft').read_text(errors='replace').splitlines():
              if line.startswith('!Sample_title = '):
                  title=line.split('=',1)[1].strip()
              if line.startswith('!Sample_supplementary_file'):
                  u=line.split('=',1)[1].strip()
                  if u and u.upper()!='NONE': urls.append(u)
          assert title and '9L' in title and 'rep2' in title, title
          h5=[u for u in urls if u.endswith('.h5ad.gz')]
          assert len(h5)==1, (title, urls)
          url=h5[0].replace('ftp://ftp.ncbi.nlm.nih.gov/','https://ftp.ncbi.nlm.nih.gov/')
          Path('/tmp/h5ad_url.txt').write_text(url+'\n')
          print('TITLE', title)
          print('OFFICIAL_H5AD_URL', url)
          PY

      - name: Download official 9L rep2 processed H5AD
        shell: bash
        run: |
          set -euo pipefail
          url=$(cat /tmp/h5ad_url.txt)
          curl --fail --location --retry 5 --retry-delay 3 --retry-all-errors \
            -o /tmp/sample.h5ad.gz "$url"
          test -s /tmp/sample.h5ad.gz
          gzip -dc /tmp/sample.h5ad.gz > /tmp/sample.h5ad
          test -s /tmp/sample.h5ad
          ls -lh /tmp/sample.h5ad.gz /tmp/sample.h5ad

      - name: Query exact ortholog locus with barcode preservation
        run: |
          mkdir -p /tmp/out
          python analysis/gap001_query_h5ad_locus.py \
            /tmp/sample.h5ad \
            --sample-id '9L,rep2' \
            --geo-accession 'GSM7876882' \
            --chrom chr8 \
            --position0 91374371 \
            --neighbor-bins 10 \
            --insertion-radius 250 \
            --output /tmp/out/GSM7876882-rs1421085-locus.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/out/GSM7876882-rs1421085-locus.json'))
          assert p['geo_accession']=='GSM7876882'
          assert p['query']['position_0_based']==91374371
          print('NUCLEI',p['nuclei'])
          print('TARGET_TILE_NUCLEI',p['target_500bp_tile']['nuclei_nonzero'])
          print('INSERTION_WINDOW_NUCLEI',p['raw_insertion_window']['nuclei_with_any_insertion'])
          print('TARGET_BARCODES',len(p['signal_carrying_nuclei']['target_tile']))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: locus-GSM7876882-repaired
          path: /tmp/out/GSM7876882-rs1421085-locus.json
          if-no-files-found: error
          retention-days: 30
