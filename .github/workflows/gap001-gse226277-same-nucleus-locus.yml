name: GAP-001 GSE226277 same-nucleus exact-locus Multiome

on:
  workflow_dispatch:
  push:
    branches:
      - agent/causal-dna-001-bootstrap
    paths:
      - 'analysis/gap001_gse226277_same_nucleus_locus.py'
      - 'tests/test_gse226277_same_nucleus_locus.py'
      - '.github/workflows/gap001-gse226277-same-nucleus-locus.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'analysis/gap001_gse226277_same_nucleus_locus.py'
      - 'tests/test_gse226277_same_nucleus_locus.py'
      - '.github/workflows/gap001-gse226277-same-nucleus-locus.yml'

permissions:
  contents: read

jobs:
  same-nucleus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - pair_id: HYPO-AH-R1
            rna_url: https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM7070nnn/GSM7070457/suppl/GSM7070457_HypoAH_filtered_feature_bc_matrix.h5
            atac_url: https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM7070nnn/GSM7070465/suppl/GSM7070465_HypoAH_atac_fragments.tsv.gz
          - pair_id: HYPO-AH-R2
            rna_url: https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM7070nnn/GSM7070459/suppl/GSM7070459_HypoAH2_filtered_feature_bc_matrix.h5
            atac_url: https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM7070nnn/GSM7070467/suppl/GSM7070467_HypoAH2_atac_fragments.tsv.gz
          - pair_id: HYPO-RH-R1
            rna_url: https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM7070nnn/GSM7070456/suppl/GSM7070456_HypoRH_filtered_feature_bc_matrix.h5
            atac_url: https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM7070nnn/GSM7070464/suppl/GSM7070464_HypoRH_atac_fragments.tsv.gz
          - pair_id: HYPO-RH-R2
            rna_url: https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM7070nnn/GSM7070458/suppl/GSM7070458_HypoRH2_filtered_feature_bc_matrix.h5
            atac_url: https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM7070nnn/GSM7070466/suppl/GSM7070466_HypoRH2_atac_fragments.tsv.gz

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: python -m pip install -r analysis/requirements.txt
      - name: Test exact-locus join contract
        run: python -m unittest tests.test_gse226277_same_nucleus_locus -v
      - name: Download paired RNA matrix only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/gse226277/${{ matrix.pair_id }} results/gap001-gse226277-same-nucleus/${{ matrix.pair_id }}
          curl --fail --location --retry 4 --retry-all-errors \
            -o data/gse226277/${{ matrix.pair_id }}/rna.h5 \
            '${{ matrix.rna_url }}'
      - name: Stream ATAC only until exact chr8 locus and join same nuclei
        run: |
          python analysis/gap001_gse226277_same_nucleus_locus.py \
            --pair-id '${{ matrix.pair_id }}' \
            --rna-h5 data/gse226277/${{ matrix.pair_id }}/rna.h5 \
            --atac-url '${{ matrix.atac_url }}' \
            --chrom chr8 \
            --start 91374000 \
            --end 91374500 \
            --output-dir results/gap001-gse226277-same-nucleus/${{ matrix.pair_id }}
      - name: Verify provenance and causal boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('results/gap001-gse226277-same-nucleus/${{ matrix.pair_id }}/summary.json'))
          assert p['dataset'] == 'GSE226277'
          assert p['pair_id'] == '${{ matrix.pair_id }}'
          assert p['assembly'] == 'mm10'
          assert p['locus'] == {'chrom':'chr8','start':91374000,'end':91374500}
          assert p['stream']['target_chromosome_seen'] is True
          forbidden={'cause_found','causal_status','materialized','verified','mediator_found'}
          assert not (forbidden & set(p))
          print('PAIR', p['pair_id'])
          print('RNA_FILTERED', p['rna_filtered_nuclei'])
          print('IRX3_RNA', p['rna_irx3_positive'])
          print('RAW_LOCUS_BARCODES', p['raw_locus_fragment_barcodes'])
          print('JOINED_LOCUS_BARCODES', p['locus_barcodes_in_filtered_rna'])
          print('LOCUS_IRX3_POSITIVE', p['locus_irx3_positive'])
          print('CANDIDATES', json.dumps(p['candidate_same_nucleus'], sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gap001-gse226277-same-nucleus-${{ matrix.pair_id }}
          path: results/gap001-gse226277-same-nucleus/${{ matrix.pair_id }}/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: same-nucleus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gap001-gse226277-same-nucleus-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate without collapsing biological replicates
        run: |
          python - <<'PY'
          import json, pathlib
          rows=[]
          for path in sorted(pathlib.Path('downloaded').glob('*/summary.json')):
              p=json.load(open(path))
              rows.append({
                  'pair_id': p['pair_id'],
                  'rna_filtered_nuclei': p['rna_filtered_nuclei'],
                  'rna_irx3_positive': p['rna_irx3_positive'],
                  'raw_locus_fragment_barcodes': p['raw_locus_fragment_barcodes'],
                  'locus_barcodes_in_filtered_rna': p['locus_barcodes_in_filtered_rna'],
                  'locus_irx3_positive': p['locus_irx3_positive'],
                  'candidate_same_nucleus': p['candidate_same_nucleus'],
              })
          assert len(rows) == 4, rows
          print(json.dumps(rows, indent=2))
          replicated=sum(r['locus_irx3_positive'] > 0 for r in rows)
          print('REPLICATES_WITH_LOCUS_IRX3_CODETECTION', replicated, '/4')
          pathlib.Path('aggregate.json').write_text(json.dumps({
              'dataset':'GSE226277',
              'pairs':rows,
              'replicates_with_locus_irx3_codetection':replicated,
              'claim_scope':'same-nucleus wild-type feasibility; no allele-specific or causal promotion'
          }, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gap001-gse226277-same-nucleus-aggregate
          path: aggregate.json
          if-no-files-found: error
          retention-days: 30
