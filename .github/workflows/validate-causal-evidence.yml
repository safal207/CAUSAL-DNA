name: Validate causal evidence

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/causal-dna-001-bootstrap
    paths:
      - 'cases/**.json'
      - 'schemas/**.json'
      - 'causal_dna/**.py'
      - 'tests/**.py'
      - 'analysis/validate_repository.py'
      - 'analysis/requirements-validation.txt'
      - '.github/workflows/validate-causal-evidence.yml'
  pull_request:
    paths:
      - 'cases/**.json'
      - 'schemas/**.json'
      - 'causal_dna/**.py'
      - 'tests/**.py'
      - 'analysis/validate_repository.py'
      - 'analysis/requirements-validation.txt'
      - '.github/workflows/validate-causal-evidence.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analysis/requirements-validation.txt
      - name: Install validation dependencies
        run: python -m pip install -r analysis/requirements-validation.txt
      - name: Run three-space graph unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate machine-readable evidence
        run: python analysis/validate_repository.py
      - name: Show three-space graph summary
        run: |
          python -m causal_dna.space_graph \
            cases/CDNA-001-rs1421085.space-graph.json \
            --start P_H3_ACCESS \
            --end M_IRX3_UP \
            --contours
