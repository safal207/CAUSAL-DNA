name: GAP-001 Codebook allele motif switch

on:
  workflow_dispatch:
  push:
    branches:
      - agent/causal-dna-001-bootstrap
    paths:
      - 'analysis/gap001_codebook_motif_switch.py'
      - 'tests/test_codebook_motif_switch.py'
      - '.github/workflows/gap001-codebook-motif-switch.yml'

permissions:
  contents: read

jobs:
  codebook-motif-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: python -m pip install -r analysis/requirements.txt

      - name: Run scanner unit tests
        run: python -m unittest tests.test_codebook_motif_switch -v

      - name: Fetch hg38 locus sequence from UCSC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/codebook
          # rs1421085: GRCh38 chr16:53767042 T>C (1-based); SPDI position 53767041 (0-based).
          # Fetch 80 bp on each side, so the variant is index 80 in the returned 161-bp sequence.
          curl --fail --location --retry 4 --retry-all-errors \
            --output data/codebook/rs1421085.hg38.json \
            'https://api.genome.ucsc.edu/getData/sequence?genome=hg38;chrom=chr16;start=53766961;end=53767122'
          python - <<'PY'
          import json
          p=json.load(open('data/codebook/rs1421085.hg38.json'))
          dna=p['dna'].upper()
          print('sequence_length', len(dna))
          print('variant_base', dna[80])
          print('context', dna[70:91])
          assert len(dna) == 161
          assert dna[80] == 'T'
          PY

      - name: Fetch published Codebook motif collection
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/autosome-ru/perspectives-on-codebook-allele-specificity.git upstream/codebook
          motif_dir='upstream/codebook/motifs/manual_motifs_v2/pwms'
          test -d "$motif_dir"
          count=$(find "$motif_dir" -maxdepth 1 -name '*.pwm' | wc -l)
          echo "PWM files: $count"
          test "$count" -gt 100

      - name: Download public GSE146692 VPH matrices
        shell: bash
        run: |
          set -euo pipefail
          root='https://raw.githubusercontent.com/TheJacksonLaboratory/ventral-posterior-hypothalamus-scrnaseq/master/data/cellranger'
          for sample in AJ18003 AJ18004 AJ19001 AJ19002; do
            mkdir -p "data/gse146692/${sample}"
            curl --fail --location --retry 4 --retry-all-errors \
              --output "data/gse146692/${sample}/filtered_feature_bc_matrix.h5" \
              "${root}/${sample}/filtered_feature_bc_matrix.h5"
          done

      - name: Run exact T>C motif-switch scan
        run: |
          python analysis/gap001_codebook_motif_switch.py \
            --motif-dir upstream/codebook/motifs/manual_motifs_v2/pwms \
            --sequence-json data/codebook/rs1421085.hg38.json \
            --variant-index 80 \
            --ref T \
            --alt C \
            --expression-root data/gse146692 \
            --top-expression 30 \
            --output-dir results/gap001-codebook-motif-switch

      - name: Show discovery report
        run: cat results/gap001-codebook-motif-switch/report.md

      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: gap001-codebook-motif-switch
          path: results/gap001-codebook-motif-switch/
          if-no-files-found: error
          retention-days: 30
