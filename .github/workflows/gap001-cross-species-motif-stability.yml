name: GAP-001 human-mouse motif stability

on:
  workflow_dispatch:
  push:
    branches:
      - agent/causal-dna-001-bootstrap
    paths:
      - 'analysis/gap001_cross_species_motif_stability.py'
      - 'analysis/gap001_codebook_motif_switch.py'
      - 'analysis/gap001_select_codebook_atlas_source.py'
      - 'analysis/gap001_prepare_codebook_atlas.py'
      - 'tests/test_cross_species_motif_stability.py'
      - 'tests/test_codebook_motif_switch.py'
      - '.github/workflows/gap001-cross-species-motif-stability.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'analysis/gap001_cross_species_motif_stability.py'
      - 'analysis/gap001_codebook_motif_switch.py'
      - 'analysis/gap001_select_codebook_atlas_source.py'
      - 'analysis/gap001_prepare_codebook_atlas.py'
      - 'tests/test_cross_species_motif_stability.py'
      - 'tests/test_codebook_motif_switch.py'
      - '.github/workflows/gap001-cross-species-motif-stability.yml'

permissions:
  contents: read

jobs:
  cross-species-motif-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scientific dependencies
        run: python -m pip install -r analysis/requirements.txt

      - name: Run scanner and cross-species unit tests
        run: |
          python -m unittest tests.test_codebook_motif_switch -v
          python -m unittest tests.test_cross_species_motif_stability -v

      - name: Select and normalize verified full Nature Codebook atlas
        run: |
          mkdir -p data/codebook-cross-species results/gap001-cross-species-motif-stability
          python analysis/gap001_select_codebook_atlas_source.py \
            --expected-tfs 1421 \
            --output-zip data/codebook-cross-species/supplementary-data-1.zip \
            --provenance-json results/gap001-cross-species-motif-stability/source-provenance.json
          python analysis/gap001_prepare_codebook_atlas.py \
            --input-zip data/codebook-cross-species/supplementary-data-1.zip \
            --output-dir data/codebook-cross-species/pwms \
            --manifest results/gap001-cross-species-motif-stability/atlas-manifest.json \
            --expected-tfs 1421

      - name: Fetch exact human and mouse SNP-centered sequence contexts
        shell: bash
        run: |
          set -euo pipefail
          # Human hg38 rs1421085: chr16:53767042 T>C (1-based); variant index 80.
          curl --fail --location --retry 4 --retry-all-errors \
            --output data/codebook-cross-species/human.hg38.json \
            'https://api.genome.ucsc.edu/getData/sequence?genome=hg38;chrom=chr16;start=53766961;end=53767122'

          # Exact mouse ortholog established by the published WT guide mapping gate:
          # mm10 chr8:91374372 T>C (1-based); 0-based base 91374371; variant index 80.
          curl --fail --location --retry 4 --retry-all-errors \
            --output data/codebook-cross-species/mouse.mm10.json \
            'https://api.genome.ucsc.edu/getData/sequence?genome=mm10;chrom=chr8;start=91374291;end=91374452'

          python - <<'PY'
          import json
          h=json.load(open('data/codebook-cross-species/human.hg38.json'))['dna'].upper()
          m=json.load(open('data/codebook-cross-species/mouse.mm10.json'))['dna'].upper()
          assert len(h) == 161 and len(m) == 161
          assert h[80] == 'T', h[80]
          assert m[80] == 'T', m[80]
          # Published guide reverse complement must occur at the expected mouse offset.
          assert m[71:89] == 'AAGGCATCGTATTGATTA', m[71:89]
          print('HUMAN_CONTEXT', h[68:93])
          print('MOUSE_CONTEXT', m[68:93])
          print('HUMAN_MOUSE_25BP_IDENTICAL', h[68:93] == m[68:93])
          PY

      - name: Scan exact T>C in human and mouse using identical motif records
        run: |
          python analysis/gap001_codebook_motif_switch.py \
            --motif-dir data/codebook-cross-species/pwms \
            --sequence-json data/codebook-cross-species/human.hg38.json \
            --variant-index 80 --ref T --alt C \
            --top-expression 0 \
            --output-dir results/gap001-cross-species-motif-stability/human

          python analysis/gap001_codebook_motif_switch.py \
            --motif-dir data/codebook-cross-species/pwms \
            --sequence-json data/codebook-cross-species/mouse.mm10.json \
            --variant-index 80 --ref T --alt C \
            --top-expression 0 \
            --output-dir results/gap001-cross-species-motif-stability/mouse

      - name: Compare the same published motif records across species
        run: |
          python analysis/gap001_cross_species_motif_stability.py \
            --human-csv results/gap001-cross-species-motif-stability/human/motif_switches.csv \
            --mouse-csv results/gap001-cross-species-motif-stability/mouse/motif_switches.csv \
            --min-abs-delta 0.10 \
            --output-dir results/gap001-cross-species-motif-stability

      - name: Verify scope and print named candidates
        run: |
          python - <<'PY'
          import csv, json
          root='results/gap001-cross-species-motif-stability'
          manifest=json.load(open(f'{root}/atlas-manifest.json'))
          summary=json.load(open(f'{root}/cross_species_motif_stability_summary.json'))
          rows=list(csv.DictReader(open(f'{root}/cross_species_motif_stability.csv')))
          by_tf={r['tf']:r for r in rows}
          assert manifest['full_atlas_contract_pass'] is True
          assert manifest['parsed_unique_tfs'] == 1421
          assert summary['unique_tfs'] == 1421
          assert summary['motif_records'] == manifest['parsed_motif_records']
          forbidden={'cause_found','causal_status','materialized','verified'}
          assert not (forbidden & set(summary))
          for tf in ('CXXC4','ARID5B'):
            assert tf in by_tf
            r=by_tf[tf]
            print(tf, 'human=', r['human_direction'], r['human_delta'], 'mouse=', r['mouse_direction'], r['mouse_delta'], 'robust=', r['robust_cross_species_delta'])
          print(open(f'{root}/cross_species_motif_stability_report.md').read())
          PY

      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: gap001-cross-species-motif-stability
          path: results/gap001-cross-species-motif-stability/
          if-no-files-found: error
          retention-days: 30
