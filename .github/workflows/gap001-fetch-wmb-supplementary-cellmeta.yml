name: GAP-001 fetch whole-brain supplementary cell metadata

on:
  workflow_dispatch:
  push:
    branches:
      - agent/causal-dna-001-bootstrap
    paths:
      - '.github/workflows/gap001-fetch-wmb-supplementary-cellmeta.yml'
  pull_request:
    paths:
      - '.github/workflows/gap001-fetch-wmb-supplementary-cellmeta.yml'

permissions:
  contents: read

jobs:
  inspect-supplementary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download a valid official Nature Supplementary Tables archive
        run: |
          set -euo pipefail
          urls=(
            'https://static-content.springer.com/esm/art%3A10.1038%2Fs41586-023-06824-9/MediaObjects/41586_2023_6824_MOESM3_ESM.zip'
            'https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41586-023-06824-9/MediaObjects/41586_2023_6824_MOESM3_ESM.zip'
          )
          : > /tmp/download-diagnostics.txt
          valid=0
          for url in "${urls[@]}"; do
            echo "TRY $url" | tee -a /tmp/download-diagnostics.txt
            rm -f /tmp/candidate
            curl -fL --retry 5 --retry-delay 3 -H 'Accept-Encoding: identity' \
              -D /tmp/headers.txt -o /tmp/candidate "$url" || continue
            ls -lh /tmp/candidate | tee -a /tmp/download-diagnostics.txt
            file /tmp/candidate | tee -a /tmp/download-diagnostics.txt
            echo 'FIRST_BYTES' | tee -a /tmp/download-diagnostics.txt
            xxd -l 64 /tmp/candidate | tee -a /tmp/download-diagnostics.txt
            echo 'LAST_BYTES' | tee -a /tmp/download-diagnostics.txt
            tail -c 64 /tmp/candidate | xxd | tee -a /tmp/download-diagnostics.txt
            cat /tmp/headers.txt >> /tmp/download-diagnostics.txt
            if python - <<'PY'
          import zipfile,sys
          sys.exit(0 if zipfile.is_zipfile('/tmp/candidate') else 1)
          PY
            then
              mv /tmp/candidate /tmp/wmb-supplementary.zip
              valid=1
              break
            fi
          done
          if [ "$valid" -ne 1 ]; then
            echo 'NO_VALID_ZIP' | tee -a /tmp/download-diagnostics.txt
            exit 2
          fi
          ls -lh /tmp/wmb-supplementary.zip

      - name: Inventory metadata-like files
        run: |
          unzip -Z1 /tmp/wmb-supplementary.zip > /tmp/all-files.txt
          echo '--- archive file count ---'
          wc -l /tmp/all-files.txt
          echo '--- candidate metadata files ---'
          grep -Ei 'supp.*(table|tab).*([345])|table.*([345])|meta|barcode|cluster|annot|legend' /tmp/all-files.txt | head -250 | tee /tmp/candidates.txt || true

      - name: Extract Tables 3-5 and metadata candidates only
        run: |
          mkdir -p /tmp/extracted
          python - <<'PY'
          import re, zipfile
          z=zipfile.ZipFile('/tmp/wmb-supplementary.zip')
          pat=re.compile(r'(supp.*(?:table|tab).*?[345](?:\D|$)|table.*?[345](?:\D|$)|meta|barcode|cluster|annot|legend)', re.I)
          selected=[n for n in z.namelist() if pat.search(n)]
          print('selected',len(selected))
          for n in selected:
              print(n)
              z.extract(n,'/tmp/extracted')
          PY
          find /tmp/extracted -type f -printf '%p\t%k KB\n' | head -250

      - name: Preview text and spreadsheet structures
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip, zipfile
          root=Path('/tmp/extracted')
          for p in sorted(root.rglob('*')):
              if not p.is_file():
                  continue
              print('\n===',p.relative_to(root),'===')
              name=p.name.lower()
              try:
                  if name.endswith(('.tsv','.csv','.txt')):
                      with p.open('r',encoding='utf-8',errors='replace') as f:
                          for _,line in zip(range(8),f): print(line.rstrip()[:1000])
                  elif name.endswith('.gz'):
                      with gzip.open(p,'rt',encoding='utf-8',errors='replace') as f:
                          for _,line in zip(range(8),f): print(line.rstrip()[:1000])
                  elif name.endswith(('.xlsx','.xlsm')):
                      with zipfile.ZipFile(p) as x:
                          print('xlsx members',x.namelist()[:40])
              except Exception as e:
                  print('PREVIEW_FAIL',e)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WMB-supplementary-cellmeta-candidates
          path: |
            /tmp/download-diagnostics.txt
            /tmp/all-files.txt
            /tmp/candidates.txt
            /tmp/extracted
          if-no-files-found: warn
