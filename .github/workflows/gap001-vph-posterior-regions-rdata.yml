name: GAP-001 posterior VPH regions RData

on:
  workflow_dispatch:
  push:
    branches:
      - agent/causal-dna-001-bootstrap
    paths:
      - 'analysis/inspect_vph_rdata.py'
      - 'analysis/requirements-rdata.txt'
      - '.github/workflows/gap001-vph-posterior-regions-rdata.yml'

permissions:
  contents: read

jobs:
  inspect-region:
    strategy:
      fail-fast: false
      matrix:
        region:
          - id: pmn
            url: https://singlecell.jax.org/datasets/vph/rdata/vph-2020_pmn.rdata
          - id: tmn_like
            url: https://singlecell.jax.org/datasets/vph/rdata/vph-2020_tmn_like.rdata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r analysis/requirements-rdata.txt
      - name: Download official region RData
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/vph-2020
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 360 \
            --output "data/vph-2020/${{ matrix.region.id }}.rdata" \
            "${{ matrix.region.url }}"
          ls -lh "data/vph-2020/${{ matrix.region.id }}.rdata"
      - name: Inspect curated region objects
        run: |
          python analysis/inspect_vph_rdata.py \
            --rdata "data/vph-2020/${{ matrix.region.id }}.rdata" \
            --output-dir "results/gap001-vph-${{ matrix.region.id }}-rdata"
      - name: Show report
        run: cat "results/gap001-vph-${{ matrix.region.id }}-rdata/report.md"
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: gap001-vph-${{ matrix.region.id }}-rdata
          path: results/gap001-vph-${{ matrix.region.id }}-rdata/
          if-no-files-found: error
          retention-days: 30
