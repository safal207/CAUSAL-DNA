name: GAP-001 exact-site hypothalamus PLAC-seq

on:
  workflow_dispatch:
  push:
    branches:
      - agent/causal-dna-001-bootstrap
    paths:
      - 'analysis/gap001_placseq_exact_site.py'
      - '.github/workflows/gap001-placseq-exact-site.yml'
  pull_request:
    paths:
      - 'analysis/gap001_placseq_exact_site.py'
      - '.github/workflows/gap001-placseq-exact-site.yml'

permissions:
  contents: read

jobs:
  exact-site-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download official processed PLAC-seq files only
        run: |
          set -euo pipefail
          base='https://ftp.ncbi.nlm.nih.gov/geo/series/GSE295nnn'
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
            -o /tmp/significant.bedpe.gz \
            "$base/GSE295850/suppl/GSE295850_BC_CB_simple.10k.2.sig3Dinteractions.bedpe.gz"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
            -o /tmp/model.txt.gz \
            "$base/GSE295850/suppl/GSE295850_basic10kb.10k.2.peaks.txt.gz"
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
            -o /tmp/fasted-loops.bed.gz \
            "$base/GSE295853/suppl/GSE295853_Loops_EdgeR_Default.bed.gz"
          ls -lh /tmp/significant.bedpe.gz /tmp/model.txt.gz /tmp/fasted-loops.bed.gz

      - name: Query exact target-bin to Irx3 promoter-bin contact
        run: |
          python analysis/gap001_placseq_exact_site.py \
            --contacts /tmp/significant.bedpe.gz \
            --model /tmp/model.txt.gz \
            --fasted-loops /tmp/fasted-loops.bed.gz \
            --output /tmp/CDNA-001-exact-site-PLACseq.json \
            | tee /tmp/exact-site-placseq.log

      - name: Verify primary call and preserve cross-callset conflict
        run: |
          python - <<'PY'
          import json, math
          p=json.load(open('/tmp/CDNA-001-exact-site-PLACseq.json'))
          assert p['authority']['significant_calls']['series']=='GSE295850'
          assert p['authority']['significant_calls']['assembly']=='GRCm38/mm10'
          assert p['coordinates']['exact_site_0_based']==['chr8',91374371,91374372]
          assert p['coordinates']['target_contact_bin_10kb']==['chr8',91370000,91380000]
          assert p['coordinates']['irx3_promoter_contact_bin_10kb']==['chr8',91800000,91810000]
          assert p['coordinates']['target_contact_bin_5kb']==['chr8',91370000,91375000]
          assert p['coordinates']['irx3_promoter_contact_bin_5kb']==['chr8',91800000,91805000]

          calls=p['significant_contact_callset']['target_to_irx3_contacts']
          candidates=p['interaction_model_table']['coordinate_candidates_near_target_and_irx3']
          stat_matches=p['interaction_model_table']['rows_matching_primary_count_expected_fdr']
          fed_rows=p['fed_fasted_state_table']['target_to_irx3_rows']
          assert len(calls)==1, calls
          call=calls[0]
          assert int(call['count'])==49
          assert math.isclose(float(call['expected']),12.6272643735288,rel_tol=1e-12)
          assert float(call['fdr']) < 0.01
          # The secondary model table does NOT reproduce the primary call's exact
          # count/expected/FDR tuple. That discrepancy is preserved as evidence,
          # not treated as permission to erase the primary published call.
          assert len(candidates)>=1, candidates
          assert len(stat_matches)==0, stat_matches
          # The separate Fed/Fasted 5-kb comparison contains the same coordinate
          # pair but does not call a metabolic-state difference significant.
          assert len(fed_rows)==1, fed_rows
          assert float(fed_rows[0]['FDR']) >= 0.05
          assert 'wild-type' in p['claim_scope'].lower()
          assert 'cannot show' in p['interpretation']['allele_boundary'].lower()
          assert '10-kb' in p['interpretation']['resolution_boundary']

          print('PRIMARY_10KB_CALL_PASS')
          print('SIGNIFICANT_EXACT_BIN_TO_IRX3',len(calls))
          print('PRIMARY_COUNT_EXPECTED_FDR',call['count'],call['expected'],call['fdr'])
          print('MODEL_COORDINATE_CANDIDATES',len(candidates))
          print('MODEL_EXACT_STAT_MATCHES',len(stat_matches))
          print('FED_FASTED_EXACT_PAIR_ROWS',len(fed_rows),'STATE_FDR',fed_rows[0]['FDR'])
          print('CROSS_CALLSET_CONFLICT: PRESERVED')
          print('GAP-001 remains OPEN; no allele dependence or mediator is established.')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: CDNA-001-exact-site-PLACseq-conflict-preserved
          path: |
            /tmp/CDNA-001-exact-site-PLACseq.json
            /tmp/exact-site-placseq.log
          if-no-files-found: error
          retention-days: 30
